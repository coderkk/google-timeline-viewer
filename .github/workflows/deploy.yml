# Deploy the static site to GitHub Pages on every push to main.
# The app routes with a HashRouter, so every refresh works under the
# /<repo>/ sub-path with no server-side rewrites; vite base is already
# relative ("./"), keeping all asset paths portable.
#
# Privacy gate (T42, DESIGN-T42.md §4): build -> privacy -> deploy.
#   - build   produces the production bundle and uploads it as artifact `dist`
#             (single source of truth; no job rebuilds it).
#   - privacy downloads `dist`, serves it with python's http.server (zero
#             install) and runs the machine privacy assertion
#             (scripts/smoke-network-tap.mjs). Exit 0/1/2 = the gate verdict;
#             a red verdict fails this job.
#   - deploy  hard-depends on BOTH build and privacy, so a violation (or a
#             broken gauge) can never reach GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd src && npm ci
      - run: cd src && npm run lint
      - run: cd src && npm run test
      - run: cd src && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: src/dist
          if-no-files-found: error

  privacy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd scripts && npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Serve dist with python http.server
        run: python3 -m http.server 4173 -d dist > /tmp/t42-http-server.log 2>&1 &
      - name: Run privacy network-tap gate
        run: node scripts/smoke-network-tap.mjs --base http://127.0.0.1:4173 --json scripts/out/privacy-tap-report.json

  deploy:
    needs: [build, privacy]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4